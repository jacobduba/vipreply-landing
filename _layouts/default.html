<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: "VIPReply" }}</title>
    <link rel="stylesheet" href="/assets/css/styles.css?v={{ site.time | date: '%s' }}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ '/assets/images/favicon.svg' | relative_url }}"
    />
    <script type="importmap">
      {
        "imports": {
          "@hotwired/turbo": "https://unpkg.com/@hotwired/turbo@8.0.12/dist/turbo.es2017-esm.js",
          "@hotwired/stimulus": "https://unpkg.com/@hotwired/stimulus@3.2.2/dist/stimulus.js",
          "controllers/mobile_menu": "/assets/js/controllers/mobile_menu_controller.js",
          "controllers/faq": "/assets/js/controllers/faq_controller.js"
        }
      }
    </script>
    <script type="module">
      import * as Turbo from "@hotwired/turbo"
      import { Application } from "@hotwired/stimulus"

      import MobileMenuController from "controllers/mobile_menu"
      import FaqController from "controllers/faq"

      // Start Stimulus application
      window.Stimulus = Application.start()

      Stimulus.register("mobile-menu", MobileMenuController)
      Stimulus.register("faq", FaqController)
    </script>
    {% if jekyll.environment == "development" %}
    <script>
      // THANK YOU CLAUDE
      // Development-only scroll preservation
      // Preserves scroll position across page reloads during development
      (function() {
        const STORAGE_KEY = 'dev_scroll_position';
        const STORAGE_PATH_KEY = 'dev_scroll_path';

        // Restore scroll position on page load
        document.addEventListener('DOMContentLoaded', function() {
          const savedPath = sessionStorage.getItem(STORAGE_PATH_KEY);
          const savedPosition = sessionStorage.getItem(STORAGE_KEY);

          if (savedPath === window.location.pathname && savedPosition) {
            window.scrollTo(0, parseInt(savedPosition, 10));
          }

          // Clear after restoring
          sessionStorage.removeItem(STORAGE_KEY);
          sessionStorage.removeItem(STORAGE_PATH_KEY);
        });

        // Save scroll position before unload
        window.addEventListener('beforeunload', function() {
          sessionStorage.setItem(STORAGE_KEY, window.scrollY.toString());
          sessionStorage.setItem(STORAGE_PATH_KEY, window.location.pathname);
        });
      })();
    </script>
    {% endif %}
  </head>
  <body class="bg-stone-50">
    {{ content }}
  </body>
</html>
